departments:
  - id: traffic_control
    label: "Controllo Traffico (virtuale)"
    endpoint: "internal://traffic_control"
    request_types: [close_road, signal_plan_change, detour_signage]
  - id: municipal_police
    label: "Polizia Municipale (virtuale)"
    endpoint: "internal://municipal_police"
    request_types: [traffic_post, crowd_control_post]
  - id: transport_control
    label: "Controllo Trasporti (virtuale)"
    endpoint: "internal://transport_control"
    request_types: [add_runs, extend_hours, bus_detour, stop_suspension]
  - id: public_comms
    label: "Comunicazione Pubblica (virtuale)"
    endpoint: "internal://public_comms"
    request_types: [citizen_notice]

response_delay_ms: 1500   # ritardo simulato RECEIVED → esito, per rendere visibile il flusso in demo
auto_timeout_s: 10
manual_timeout_s: 60      # attesa della risposta manuale (04 5); allo scadere: REJECTED, codice TIMEOUT
