sensors:
  # --- sonde GPS su mezzi di servizio (coprono la rete) ---------------------------------------------
  - id: gps_probes
    type: gps_probe
    name: "Sonde GPS su bus ANM e flotte comunali"
    status: planned
    measures: "Posizione e velocità dei mezzi di servizio (bus ANM, raccolta rifiuti, Polizia Municipale, manutenzione): da qui, velocità e tempi di percorrenza per strada e ritardi dei bus."
    replaces: "La velocità in tempo reale oggi solo di TomTom (resterebbe una fonte in più), le velocità a flusso libero e i valori di riserva per classe di strada, il traffico di fondo oggi a quota fissa."

  # --- tornelli e validatori ANM (nelle stazioni delle linee) ---------------------------------------
  - id: turnstiles_metro_line_1
    type: turnstile
    name: "Tornelli e validatori ANM — Linea 1"
    status: planned
    route_class: metro_line_1
    measures: "Ingressi (e uscite dove presenti) a ogni stazione della Linea 1, a intervalli di pochi minuti."
    replaces: "I carichi per tratta e per fermata della Linea 1, oggi stimati, e la ripartizione tra i modi di trasporto per tipo di zona."
  - id: turnstiles_metro_line_6
    type: turnstile
    name: "Tornelli e validatori ANM — Linea 6"
    status: planned
    route_class: metro_line_6
    measures: "Ingressi (e uscite dove presenti) a ogni stazione della Linea 6, a intervalli di pochi minuti."
    replaces: "I carichi per tratta e per fermata della Linea 6, oggi stimati, e la ripartizione tra i modi di trasporto per tipo di zona."
  - id: turnstiles_funicular
    type: turnstile
    name: "Tornelli e validatori ANM — Funicolari"
    status: planned
    route_class: funicular
    measures: "Ingressi (e uscite dove presenti) a ogni stazione delle funicolari, a intervalli di pochi minuti."
    replaces: "I carichi per tratta e per fermata delle funicolari, oggi stimati, e la ripartizione tra i modi di trasporto per tipo di zona."

