:root{
/* Neutri */
--color-bg:#0D111C;--color-surface-1:#141A2A;--color-surface-2:#1B2336;--color-surface-3:#252F47;
--color-border:#222B40;--color-border-strong:#3B4763;
--color-border-card:rgba(59,71,99,.30);--color-border-tooltip:rgba(59,71,99,.70);
--color-text:#E8ECF5;--color-text-secondary:#9AA3B8;--color-text-muted:#5E6780;
--color-overlay:rgba(0,0,0,.60);
/* Accenti e stati */
--color-accent:#9B6BFF;--color-accent-hover:#AE8BFF;--color-accent-2:#6B7CF5;
--color-success:#12BFA0;--color-warning:#D4A93A;--color-danger:#EE5663;
/* Nomi obbligatori del brief */
--color-data-real:#12BFA0;--color-data-estimate:#4DA3FF;--color-data-simulated:#F26A2E;--color-data-unavailable:#9AA3B8;
--color-scenario-frame:#F26A2E;
--color-status-accepted:#12BFA0;--color-status-rejected:#EE5663;--color-status-pending:#D4A93A;
--color-delta-better:#12BFA0;--color-delta-worse:#EE5663;
/* Riempimenti badge (16% su surface-1) */
--color-badge-fill-real:#14343D;--color-badge-fill-estimate:#1D304C;--color-badge-fill-simulated:#38272B;--color-badge-fill-unavailable:#293041;--color-badge-fill-pending:#33312D;
/* Riempimenti chip (20%) e modalità */
--color-state-fill-running:#2F2A55;--color-state-fill-waiting:#3A372D;--color-state-fill-done:#143B42;--color-state-fill-error:#402635;
--color-mode-fill-live:#143B42;--color-mode-fill-scenario:#402A2B;
--color-row-hover:#252F47;
/* Grafici */
--color-chart-1:#9B6BFF;--color-chart-2:#D4A93A;--color-chart-3:#9AA3B8;--color-chart-4:#6B7CF5;
/* Mappa */
--color-map-congestion-1:#12BFA0;--color-map-congestion-2:#D4A93A;--color-map-congestion-3:#EE5663;--color-map-congestion-4:#C84BE0;
--color-map-closure:#E8ECF5;--color-map-detour:#9B6BFF;--color-map-event-area:#6B7CF5;
--color-map-stop-low:#12BFA0;--color-map-stop-mid:#D4A93A;--color-map-stop-over:#EE5663;
/* Alias semantici */
--surface-screen:var(--color-bg);--surface-card:var(--color-surface-1);--surface-nested:var(--color-surface-2);--surface-hover:var(--color-surface-3);
--text-primary:var(--color-text);--text-support:var(--color-text-secondary);
--action:var(--color-accent);--action-hover:var(--color-accent-hover);--focus-ring:var(--color-accent);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text);font:var(--fw-md) var(--fs-md)/var(--lh-md) var(--font-ui);-webkit-font-smoothing:antialiased}

.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.t-kpi{font:var(--fw-kpi) var(--fs-kpi)/var(--lh-kpi) var(--font-mono);letter-spacing:var(--ls-kpi);font-variant-numeric:tabular-nums}
.t-kpi-sm{font:var(--fw-kpi-sm) var(--fs-kpi-sm)/var(--lh-kpi-sm) var(--font-mono);font-variant-numeric:tabular-nums}
