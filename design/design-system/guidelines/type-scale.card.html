<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><style>.r{display:grid;grid-template-columns:110px 1fr 150px;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--color-border)}.r code{font:500 13px var(--font-mono);color:var(--color-text-secondary)}</style><div class="r"><code>--fs-2xl</code><span class="t-2xl">Titolo pagina</span><code>32/40 · 700</code></div><div class="r"><code>--fs-xl</code><span class="t-xl">Titolo sezione</span><code>24/32 · 600</code></div><div class="r"><code>--fs-lg</code><span class="t-lg">Titolo card</span><code>20/28 · 600</code></div><div class="r"><code>--fs-md</code><span class="t-md">Testo di lettura</span><code>16/24 · 400</code></div><div class="r"><code>--fs-sm</code><span class="t-sm">UI e celle di tabella</span><code>15/22 · 400</code></div><div class="r"><code>--fs-xs</code><span class="t-xs">Tag e didascalie</span><code>14/20 · 500</code></div><div class="r"><code>--fs-badge</code><span class="t-badge">Badge dato</span><code>14/20 · 600 · +0,04em</code></div></body></html>
