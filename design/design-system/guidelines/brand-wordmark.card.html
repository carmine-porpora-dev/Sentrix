<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            padding: 20px
        }

        .g {
            display: grid;
            gap: 10px
        }

        .sw {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0
        }

        .sw i {
            display: block;
            height: 56px;
            border-radius: 8px;
            border: 1px solid var(--color-border-card)
        }

        .sw b {
            font: 600 14px/18px var(--font-ui)
        }

        .sw span {
            font: 500 13px/16px var(--font-mono);
            color: var(--color-text-secondary)
        }

        .cap {
            font: 500 14px/20px var(--font-ui);
            color: var(--color-text-secondary);
            margin: 0 0 8px
        }
    </style>
</head>

<body>
    <div style="display:flex;align-items:center;gap:32px;height:130px">
        <div
            style="flex:1;background:var(--color-surface-1);border:1px solid var(--color-border-card);border-radius:10px;height:100%;display:grid;place-items:center">
            <div style="font:700 28px/36px var(--font-ui);letter-spacing:-.01em">Sentrix</div>
        </div>
        <div
            style="width:130px;background:var(--color-accent);border-radius:10px;height:100%;display:grid;place-items:center;color:var(--color-bg);font:700 22px/28px var(--font-ui);text-align:center">
            Napoli<br>Urban Ops</div>
    </div>
</body>

</html>
