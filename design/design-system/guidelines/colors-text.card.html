<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--color-text)"></i><b>text</b><span>#F2EDE6</span></div><div class="sw"><i style="background:var(--color-text-secondary)"></i><b>text-secondary</b><span>#A39B90</span></div><div class="sw"><i style="background:var(--color-text-muted)"></i><b>text-muted</b><span>#6F685F</span></div><div class="sw"><i style="background:var(--color-border)"></i><b>border</b><span>#2E2A25</span></div><div class="sw"><i style="background:var(--color-border-strong)"></i><b>border-strong</b><span>#4A453E</span></div></div></body></html>
