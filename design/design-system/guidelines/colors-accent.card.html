<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><i style="background:var(--color-accent)"></i><b>accent</b><span>#5B7CFA</span></div><div class="sw"><i style="background:var(--color-accent-hover)"></i><b>accent-hover</b><span>#7994FB</span></div><div class="sw"><i style="background:var(--color-accent-2)"></i><b>accent-2</b><span>#6B7CF5</span></div><div class="sw"><i style="background:var(--color-success)"></i><b>success</b><span>#12BFA0</span></div><div class="sw"><i style="background:var(--color-warning)"></i><b>warning</b><span>#D4A93A</span></div><div class="sw"><i style="background:var(--color-danger)"></i><b>danger</b><span>#EE5663</span></div></div></body></html>
