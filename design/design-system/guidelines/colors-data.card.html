<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--color-data-real)"></i><b>data-real</b><span>#12BFA0</span></div><div class="sw"><i style="background:var(--color-data-estimate)"></i><b>data-estimate</b><span>#4DA3FF</span></div><div class="sw"><i style="background:var(--color-data-simulated)"></i><b>data-simulated</b><span>#F26A2E</span></div><div class="sw"><i style="background:var(--color-data-unavailable)"></i><b>data-unavailable</b><span>#A39B90</span></div><div class="sw"><i style="background:var(--color-scenario-frame)"></i><b>scenario-frame</b><span>#F26A2E</span></div></div></body></html>
