<!-- @dsCard group="Colors" viewport="700x170" name="Stati richiesta e delta" subtitle="Il colore non è mai l'unico segnale: sempre icona" -->
<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--color-status-accepted)"></i><b>status-accepted</b><span>#12BFA0</span></div><div class="sw"><i style="background:var(--color-status-rejected)"></i><b>status-rejected</b><span>#EE5663</span></div><div class="sw"><i style="background:var(--color-status-pending)"></i><b>status-pending</b><span>#D4A93A</span></div><div class="sw"><i style="background:var(--color-delta-better)"></i><b>delta-better</b><span>#12BFA0</span></div><div class="sw"><i style="background:var(--color-delta-worse)"></i><b>delta-worse</b><span>#EE5663</span></div></div></body></html>
