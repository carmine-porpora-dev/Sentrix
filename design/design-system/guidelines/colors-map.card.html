<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><i style="background:var(--color-map-congestion-1)"></i><b>classe 1</b><span>#12BFA0</span></div><div class="sw"><i style="background:var(--color-map-congestion-2)"></i><b>classe 2</b><span>#D4A93A</span></div><div class="sw"><i style="background:var(--color-map-congestion-3)"></i><b>classe 3</b><span>#EE5663</span></div><div class="sw"><i style="background:var(--color-map-congestion-4)"></i><b>classe 4</b><span>#C84BE0</span></div></div><div class="g" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><div class="sw"><i style="background:var(--color-map-closure)"></i><b>chiusure</b><span>#E8ECF5 · tratteggio</span></div><div class="sw"><i style="background:var(--color-map-detour)"></i><b>deviazioni</b><span>#3495D2</span></div><div class="sw"><i style="background:var(--color-map-event-area)"></i><b>area evento</b><span>#6B7CF5 · 12%</span></div></div></body></html>
