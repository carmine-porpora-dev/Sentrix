<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-border-card)}.sw b{font:600 14px/18px var(--font-ui)}.sw span{font:500 13px/16px var(--font-mono);color:var(--color-text-secondary)}.cap{font:500 14px/20px var(--font-ui);color:var(--color-text-secondary);margin:0 0 8px}</style></head><body><div style="display:flex;gap:16px;align-items:center"><div style="flex:1;height:72px;display:grid;place-items:center;background:var(--color-surface-1);border:1px solid var(--color-border-card);border-radius:6px;outline:none;outline-offset:2px" class="t-sm"><span style="font-weight:600">Riposo</span></div><div style="flex:1;height:72px;display:grid;place-items:center;background:var(--color-surface-2);border:1px solid var(--color-border-card);border-radius:6px;outline:none;outline-offset:2px" class="t-sm"><span style="font-weight:600">Hover</span></div><div style="flex:1;height:72px;display:grid;place-items:center;background:var(--color-surface-3);border:1px solid var(--color-border-card);border-radius:6px;outline:none;outline-offset:2px" class="t-sm"><span style="font-weight:600">Premuto</span></div><div style="flex:1;height:72px;display:grid;place-items:center;background:var(--color-surface-1);border:1px solid var(--color-border-card);border-radius:6px;outline:2px solid var(--color-accent);outline-offset:2px" class="t-sm"><span style="font-weight:600">Focus</span></div></div></body></html>
