<!-- @dsCard group="Type" viewport="700x190" name="Famiglie" subtitle="Plus Jakarta Sans (UI) + Geist Mono (numeri)" -->
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            padding: 20px
        }

        .g {
            display: grid;
            gap: 10px
        }

        .sw {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0
        }

        .sw i {
            display: block;
            height: 56px;
            border-radius: 8px;
            border: 1px solid var(--color-border-card)
        }

        .sw b {
            font: 600 14px/18px var(--font-ui)
        }

        .sw span {
            font: 500 13px/16px var(--font-mono);
            color: var(--color-text-secondary)
        }

        .cap {
            font: 500 14px/20px var(--font-ui);
            color: var(--color-text-secondary);
            margin: 0 0 8px
        }
    </style>
</head>

<body>
    <div style="display:flex;justify-content:space-between;gap:24px">
        <div>
            <p class="cap">Plus Jakarta Sans · 400 500 600 700</p>
            <div style="font:700 44px/52px var(--font-ui);letter-spacing:-.01em">Sentrix</div>
            <div class="t-md" style="color:var(--color-text-secondary)">Titoli, UI, testo di lettura</div>
        </div>
        <div style="text-align:right">
            <p class="cap">Geist Mono · 500 600 700</p>
            <div class="num" style="font:700 44px/52px var(--font-mono)">12.480</div>
            <div class="t-md" style="color:var(--color-text-secondary)">Numeri, KPI, tabelle</div>
        </div>
    </div>
</body>

</html>
