<script src="../../_ds_bundle.js"></script></head><body><div id="r"></div><script type="text/babel">const {MapToggle,LayerPanel,MapMarker,MapLegend,MapAttribution}=window.DesignSystem_1776e0;
function App(){const [a,setA]=React.useState(false),[i,setI]=React.useState(1);
const [L,setL]=React.useState([{id:'c',name:'Congestione',color:'var(--color-map-congestion-2)',on:true},{id:'x',name:'Chiusure',color:'var(--color-map-closure)',on:true,dashed:true},{id:'d',name:'Deviazioni',color:'var(--color-map-detour)',on:true,dashed:true},{id:'e',name:'Area evento',color:'var(--color-map-event-area)',on:false},{id:'f',name:'Fermate',color:'var(--color-map-stop-low)',on:true},{id:'r',name:'Richieste',color:'var(--color-accent)',on:true}]);
return <div style={{display:'grid',gridTemplateColumns:'1fr 236px',gap:24}}><div>
<p className="cap">Toggle mappa</p><div className="row"><MapToggle after={a} onAfterChange={setA} iteration={i} onIterationChange={setI}/></div>
<p className="cap">Marker · 4 dipartimenti × normale / accettata / rifiutata</p>
<div style={{display:'grid',gridTemplateColumns:'repeat(4,56px)',gap:'14px 20px',marginBottom:20}}>{['traffic','police','transport','comms'].map(d=>['normal','accepted','rejected'].map(s=><MapMarker key={d+s} dept={d} state={s}/>))}</div>
<p className="cap">Legenda e attribuzione</p><div className="row"><MapLegend/><MapAttribution/></div></div>
<LayerPanel layers={L} onToggle={id=>setL(L.map(l=>l.id===id?{...l,on:!l.on}:l))}/></div>}</script><script type="text/babel">ReactDOM.createRoot(document.getElementById('r')).render(<App/>)</script></body></html>
